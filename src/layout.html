<!-- Applied before first paint so scroll-reveal starts hidden without a flash.
     If scripting is off this class is never set and all content is visible.
     `from-nav` marks a page reached through the departure wipe, which has
     already faded the mark up and is still showing it: the arrival curtain
     carries that mark on rather than fading it in a second time, which across
     the swap would read as a flicker. -->
<script>(function(){var h=document.documentElement;h.className+=' js';try{if(sessionStorage.getItem('mbc-nav')){h.className+=' from-nav';sessionStorage.removeItem('mbc-nav');}}catch(e){}})();</script>
